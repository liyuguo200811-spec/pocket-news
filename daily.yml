name: 每日更新

# 北京时间每天 06:00 跑一次（GitHub 用的是 UTC，所以往前推 8 小时）
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:        # 也可以在网页上手动点一下

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取当日热点
        # 抓取失败不中断，沿用仓库里上一次的 news.json 继续生成
        run: python fetch.py || echo "::warning::抓取失败，沿用上一次的数据"

      - name: 生成极简页面
        run: python build.py

      - name: 提交并推送
        run: |
          git config user.name  "pocket-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "每日更新 $(date -u -d '+8 hours' +%Y-%m-%d)"
            git push
          fi
