name: 每日更新

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取当日新闻
        run: python fetch.py || echo "::warning::抓取失败，沿用上一次数据"

      - name: 生成页面
        run: python build.py

      - name: 提交改动
        run: |
          git config user.name  "pocket-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "内容没有变化"
          else
            git commit -m "每日更新 $(date -u -d '+8 hours' +%Y-%m-%d)"
            git push
          fi
