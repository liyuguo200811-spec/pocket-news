<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>孔子</title></head><body><p><b>孔子</b></p><p>中国古代　知其不可而为之</p><p>名丘，字仲尼。少年丧父，做过管仓库、管牛羊的小吏。三十岁左右办学，主张“有教无类”，相传弟子三千。五十五岁起周游列国十四年，屡遭困厄，仍弦歌不辍。晚年整理《诗》《书》，删述《春秋》。</p><p>适用 坚持·教育公平·理想主义</p><p><a href="sucai">回素材库</a> <a href="sc02">下一张</a></p></body></html>
