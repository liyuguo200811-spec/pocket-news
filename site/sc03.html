<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>司马迁</title></head><body><p><b>司马迁</b></p><p>中国古代　人固有一死，或重于泰山</p><p>继父职任太史令，因替李陵辩护触怒汉武帝，受宫刑。出狱后发愤著《史记》，历时十四年成书一百三十篇。《报任安书》里写：“人固有一死，或重于泰山，或轻于鸿毛。”鲁迅称其为“史家之绝唱”。</p><p>适用 苦难·坚韧·使命</p><p><a href="sucai">回素材库</a> <a href="sc02">上一张</a> <a href="sc04">下一张</a></p></body></html>
