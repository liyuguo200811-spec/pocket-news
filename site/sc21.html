<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>袁隆平</title></head><body><p><b>袁隆平</b></p><p>中国近现代　把论文写在大地上</p><p>1961 年在稻田里发现一株“鹤立鸡群”的稻株，从此一头扎进杂交水稻。1973 年成功培育出第一代杂交水稻，让亩产从三百公斤一路往上走。他常说“电脑里长不出水稻”，八十多岁还天天下田。</p><p>适用 实干·坚持·粮食安全</p><p><a href="sucai">回素材库</a> <a href="sc20">上一张</a> <a href="sc22">下一张</a></p></body></html>
