<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>人民日报评“小学生只上半天学”</title></head><body><p><a href="/">返回</a></p><p><b>人民日报评“小学生只上半天学”</b></p><p>百度热搜　热度 752.3万</p><p>近来，部分家长因焦虑让孩子“只上半天学”以超前学习备考名校，引发热议。人民日报评论指出，此举系拔苗助长式的短视内卷，长期高密度填鸭会消耗孩子学习热情，忽视身心健康。文章呼吁教育应如水墨画般留白，培养孩子探索兴趣与健康价值观，而非只盯分数。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
