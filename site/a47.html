<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>出货暴跌40% 非洲成全球最惨手</title></head><body><p><a href="/">返回</a></p><p><b>出货暴跌40% 非洲成全球最惨手机市场</b></p><p>百度热搜　热度 742.8万</p><p>11月23日，市场研究机构Omdia公布的数据显示，2026年第三季度，非洲智能手机出货量由上年同期的2280万部降至1370万部，同比下降40%，创三年来最大同比跌幅。其他主要市场的跌幅均不及非洲。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
