<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>家门口藏备用钥匙的注意了</title></head><body><p><a href="/">返回</a></p><p><b>家门口藏备用钥匙的注意了</b></p><p>百度热搜　热度 752.1万</p><p>今年7月28日，沈阳陈女士报警称家中4万元被盗，门窗完好。陈女士在警方建议下安装监控，两天后嫌疑人李某再次潜入被当场抓获。李某交代累计盗窃10万余元，而陈女士仅发现4万元被盗。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
