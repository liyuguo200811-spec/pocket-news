<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>弟弟为独吞133万遗产翻脸不认姐</title></head><body><p><a href="/">返回</a></p><p><b>弟弟为独吞133万遗产翻脸不认姐姐</b></p><p>百度热搜　热度 752.1万</p><p>近日，上海浦东法院审结一起遗产纠纷案。张女士凭间接证据获确认继承人资格，获赔64.75万元。此前，张女士弟弟去世留133万余元遗产。因其户籍档案灭失无法证明亲属关系，另一弟弟张先生借机否认其姐姐身份想独吞遗产，张女士遂提交墓碑照片等证据形成完整证据链获法院支持。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
