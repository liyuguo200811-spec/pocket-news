<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>余文乐自曝躯体化严重到不能开车</title></head><body><p><a href="/">返回</a></p><p><b>余文乐自曝躯体化严重到不能开车</b></p><p>百度热搜　热度 742.6万</p><p>近日，余文乐在节目中自曝，二十到三十岁时他处于爆红期时，因长期身处高压负面环境。他曾因恐慌症引发严重躯体化症状，会在开车途中突然手抖、冒冷汗无法呼吸，只能紧急靠边停车，此后不敢再开车，甚至害怕坐飞机。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
