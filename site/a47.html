<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>国产可口可乐不再标生产日期</title></head><body><p><a href="/">返回</a></p><p><b>国产可口可乐不再标生产日期</b></p><p>百度热搜　热度 752.2万</p><p>近日，吉林长春有网友发现新买的可口可乐瓶身不再标注生产日期，仅印有保质期和到期日，中粮可口可乐客服证实，根据新版食品安全国家标准，新出厂产品已统一改标到期日，老款仍正常流通。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
