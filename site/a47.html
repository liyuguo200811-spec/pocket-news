<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>71岁郑渊洁用AI独自“手搓”动</title></head><body><p><a href="/">返回</a></p><p><b>71岁郑渊洁用AI独自“手搓”动画片</b></p><p>百度热搜　热度 752.2万</p><p>近日，郑渊洁受访表示，目前用AI独立制作童话动画并免费发布，称“AI时代就是干掉所有团队”，计划出自传后告别纸质书。此前，他因商标维权无果宣布停刊停更。10月24日其账号已发布首条AI动画，近期因涉事“舒克”商标被注销，他恢复更新。</p><p><a href="a46">上一条</a> <a href="a48">下一条</a></p></body></html>
