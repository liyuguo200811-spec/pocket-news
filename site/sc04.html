<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>张骞</title></head><body><p><b>张骞</b></p><p>中国古代　凿空西域</p><p>公元前 138 年奉命出使大月氏，途中被匈奴扣留十年，仍持汉节不失。逃脱后继续西行，历十三年方归。第二次出使西域，打通中原与中亚的通道，史称“凿空”。</p><p>适用 开拓·守信·坚持</p><p><a href="sucai">回素材库</a> <a href="sc03">上一张</a> <a href="sc05">下一张</a></p></body></html>
