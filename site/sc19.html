<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>李时珍</title></head><body><p><b>李时珍</b></p><p>中国古代　二十七年修一部书</p><p>三次乡试落第后弃儒从医，发现旧本草书错误甚多，决心重修。历时二十七年，翻阅八百余种书，亲赴各地采药考察，三易其稿，写成《本草纲目》五十二卷，收药一千八百九十二种。</p><p>适用 实证·坚持·纠错</p><p><a href="sucai">回素材库</a> <a href="sc18">上一张</a> <a href="sc20">下一张</a></p></body></html>
