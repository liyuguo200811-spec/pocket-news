<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>李白</title></head><body><p><b>李白</b></p><p>中国古代　仗剑去国，辞亲远游</p><p>少年出游，一生走过大半个中国。天宝元年入长安供奉翰林，三年后赐金放还。安史之乱中因附永王获罪流放夜郎，途中遇赦。存诗九百余首，想象奇绝，人称“诗仙”。</p><p>适用 才华·自由·浪漫</p><p><a href="sucai">回素材库</a> <a href="sc10">上一张</a> <a href="sc12">下一张</a></p></body></html>
