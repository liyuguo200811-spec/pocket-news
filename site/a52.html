<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>郭晶晶有新身份</title></head><body><p><a href="/">返回</a></p><p><b>郭晶晶有新身份</b></p><p>百度热搜　热度 704.4万</p><p>11月20日，在浙江杭州举办的首届历史经典产业博览会上，工业和信息化部正式邀请郭晶晶任中国消费名品公益形象大使。郭晶晶发文感谢并呼吁多用国货，旨在向全球传递中国消费品牌优质形象，助力提升中国消费名品社会公信力与大众认同感。</p><p><a href="a51">上一条</a></p></body></html>
