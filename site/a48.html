<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>小伙给去世女友发“我来了”后失联</title></head><body><p><a href="/">返回</a></p><p><b>小伙给去世女友发“我来了”后失联</b></p><p>百度热搜　热度 742.5万</p><p>四川德阳27岁男子曾成在女友离世、办完后事当天离家失联。他失联前给母亲转钱、向同事留言告别，还在女友微信留下“等着，我来了”。其手机最后信号出现在继光水库，至今已失联7天，家属联合救援力量搜救，警方也在调查搜寻。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
