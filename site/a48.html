<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>登机口扔硬币女子第一次坐飞机</title></head><body><p><a href="/">返回</a></p><p><b>登机口扔硬币女子第一次坐飞机</b></p><p>百度热搜　热度 742.4万</p><p>日前，一名女性旅客首次坐飞机，为“祈福保平安”她在登机口向机坪投掷硬币，致航班延误近一小时。机组报警后，十多人经搜寻找回硬币并排除安全隐患。专家指出，抛硬币暗藏严重航空安全隐患，若致严重后果或构成破坏交通工具罪。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
