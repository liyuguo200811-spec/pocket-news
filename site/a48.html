<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>村民性侵少女被判无罪 最高检抗诉</title></head><body><p><a href="/">返回</a></p><p><b>村民性侵少女被判无罪 最高检抗诉</b></p><p>百度热搜　热度 752.0万</p><p>11月21日，最高检发布指导性案例披露一起性侵案。2015年，四名村民在宁夏某县先后强奸一名精神发育迟滞的未成年女性。其中黄某升曾因证据不足被二审改判无罪。最高检通过咬痕牙模比对等关键证据两次抗诉，2023年9月5日，甘肃省高院再审采纳最高检意见，改判黄某升有期徒刑五年六个月。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
