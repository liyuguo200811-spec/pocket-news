<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>中国最大饺子IPO来了</title></head><body><p><a href="/">返回</a></p><p><b>中国最大饺子IPO来了</b></p><p>百度热搜　热度 742.8万</p><p>袁记食品已通过港交所上市聆讯，将缔造中国最大饺子IPO。该品牌由90后创始人于2012年在广州创立，主打现包现卖。随后凭借加盟与中央厨房模式扩张，截至2026年5月，全国门店超4700家，2025年营收达27.95亿元。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
