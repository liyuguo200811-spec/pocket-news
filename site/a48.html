<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>涉案金额超150亿元 舒某某被引</title></head><body><p><a href="/">返回</a></p><p><b>涉案金额超150亿元 舒某某被引渡回国</b></p><p>百度热搜　热度 742.5万</p><p>11月5日，涉案超150亿元的经济犯罪嫌疑人舒某某从俄罗斯被引渡回国。此前，舒某某以虚构理财产品非法吸收存款，浙江省宁波市公安机关于2024年10月对其立案侦查。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
