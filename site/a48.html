<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>两个人迟到的婚礼 全村全网都在操</title></head><body><p><a href="/">返回</a></p><p><b>两个人迟到的婚礼 全村全网都在操心</b></p><p>百度热搜　热度 742.5万</p><p>“和老婆结婚十年，一直欠她一场婚礼……现在终于有能力，定于11月26日在村里补办这场迟来的婚礼。”近日，36岁的涟源汉子彭盛红向网友发出邀约。此前因双亲离世守孝不便操办，其妻子10年来一直操持家务照顾小孩。如今，全国各地网友朋友纷纷送来猪、酒和白菜等礼物祝贺，共同见证这场婚礼。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
