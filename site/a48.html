<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>15家电动自行车企业被集中约谈</title></head><body><p><a href="/">返回</a></p><p><b>15家电动自行车企业被集中约谈</b></p><p>百度热搜　热度 742.7万</p><p>11月27日，市场监管总局集中约谈雅迪、台铃、爱玛等15家电动自行车企业，指出飞行检查发现部分企业质量责任落实不到位、产品不合格等问题，要求严格落实整改、加强产品管控并做好售后服务。</p><p><a href="a47">上一条</a> <a href="a49">下一条</a></p></body></html>
