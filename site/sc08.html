<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>王羲之</title></head><body><p><b>王羲之</b></p><p>中国古代　临池学书，池水尽墨</p><p>七岁学书，临池练字，池水尽墨。官至右军将军，世称“王右军”。永和九年与友人在兰亭雅集，写下《兰亭集序》，二十八行三百二十四字，被誉为“天下第一行书”。</p><p>适用 勤奋·极致·艺术</p><p><a href="sucai">回素材库</a> <a href="sc07">上一张</a> <a href="sc09">下一张</a></p></body></html>
