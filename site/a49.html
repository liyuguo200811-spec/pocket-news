<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>小雪养生 做好这几件事很重要</title></head><body><p><a href="/">返回</a></p><p><b>小雪养生 做好这几件事很重要</b></p><p>百度热搜　热度 723.9万</p><p>11月22日迎来小雪节气。此时节人体阳气潜藏，养生需养阳藏阳。建议牢记“三不要”：早睡晚起不熬夜、食补不过量、动静结合不久坐；做好“四防”：防呼吸道与心脑血管疾病、防流感及摔伤；同时做到“三宜”：适量吃黑色食物益肾、适当饮水促代谢、多晒太阳疏解情绪。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
