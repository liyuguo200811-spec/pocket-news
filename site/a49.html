<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>男子提供上门服务教自行车被判定涉</title></head><body><p><a href="/">返回</a></p><p><b>男子提供上门服务教自行车被判定涉黄</b></p><p>百度热搜　热度 733.2万</p><p>近日，上海阚先生在闲鱼发布的“上门教自行车”链接，因含“上门”字样及女生骑车视频被误判涉黄遭下架，导致其收入骤降。此前，阚先生于11月6日赴闲鱼杭州总部申诉。次日，平台撤销其违规处罚。目前，被误判链接已恢复正常显示，平台回应称严打中或存在误伤。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
