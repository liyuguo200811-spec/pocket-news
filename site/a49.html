<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>全球PCB供应告急</title></head><body><p><a href="/">返回</a></p><p><b>全球PCB供应告急</b></p><p>百度热搜　热度 732.8万</p><p>近日，全球电子协会警告全球正面临印刷电路板（PCB）大短缺。因AI服务器层数暴增致使上游特种材料供应不足，科技巨头提前锁定产能，导致汽车、医疗及国防产业面临断供风险。此前欧美将制造业大规模外包，当前合计产能不足全球6%，高端板交货期已排至2028年。协会呼吁各国政府提供补贴并加快审批。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
