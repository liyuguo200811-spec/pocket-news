<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>许多年轻人为何开始“重新养父母”</title></head><body><p><a href="/">返回</a></p><p><b>许多年轻人为何开始“重新养父母”</b></p><p>百度热搜　热度 733.1万</p><p>近期，许多年轻人开始流行“重新养父母”，通过教父母用智能手机、带其体验新鲜事物等，将父母需求置于首位。此现象背后是亲子角色位移、换位思考及“子欲养而亲不待”的紧迫感，并呼吁尊重父母意愿、社会共同托底养老。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
