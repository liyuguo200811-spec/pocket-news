<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>魏建军称汽车贬值速度离谱</title></head><body><p><a href="/">返回</a></p><p><b>魏建军称汽车贬值速度离谱</b></p><p>百度热搜　热度 733.4万</p><p>11月26日，魏建军拜访格力电器与董明珠同框直播。董明珠称年轻人易被舆论忽悠，制造企业必须清楚生命第一位。魏建军表示汽车贬值速度已到离谱程度，不少车企缺现金流靠降价、压榨供应商硬撑，陷入恶性循环。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
