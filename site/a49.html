<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>女子称因年龄超40岁被酒店拒绝入</title></head><body><p><a href="/">返回</a></p><p><b>女子称因年龄超40岁被酒店拒绝入住</b></p><p>百度热搜　热度 732.9万</p><p>11月26日，浙江嘉兴荔枝酒店回应，40岁以上不能入住是老板规定，预订平台没有醒目提示。11月19日，57岁的李女士预订该酒店床位房，到店后被以超龄为由拒办入住。当地警方称，该年龄限制是酒店自主规定，公安并无此项要求。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
