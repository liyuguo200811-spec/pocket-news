<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>韩国高考出中国历史题 9成考生答</title></head><body><p><a href="/">返回</a></p><p><b>韩国高考出中国历史题 9成考生答错</b></p><p>百度热搜　热度 742.5万</p><p>21日，韩国教育课程评价院公布，高考世界史第二题收到14条申诉。在19日的高考中，该题因描述中国古代皇帝政策致超9成考生答错。官方答案依据“开凿广通渠”定为隋文帝，而多数考生误认是秦始皇选了焚书坑儒。考生质疑，称AI模型给出的答案也与官方不同。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
