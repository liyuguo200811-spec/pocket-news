<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>武契奇：收到极其严重的死亡威胁</title></head><body><p><a href="/">返回</a></p><p><b>武契奇：收到极其严重的死亡威胁</b></p><p>百度热搜　热度 723.8万</p><p>11月24日，塞尔维亚前总统武契奇在电视节目中表示，其于11月22日收到极其严重的死亡威胁。针对其或将被捕并面临刑事起诉的传闻，武契奇回应称未涉及任何刑事案件，并表示即使被关进监狱，也是政治对手的噩梦。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
