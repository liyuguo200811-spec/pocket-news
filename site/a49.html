<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>中方回应“美将对中国等国加征关税</title></head><body><p><a href="/">返回</a></p><p><b>中方回应“美将对中国等国加征关税”</b></p><p>百度热搜　热度 732.8万</p><p>11月25日，外交部记者会上，记者问及美国拟对中国等国商品加征关税一事。发言人郭嘉昆表示，贸易战损人害己，中方反对借“产能过剩”进行政治操弄，呼吁双方基于平等互惠协商，落实元首共识，稳定经贸关系。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
