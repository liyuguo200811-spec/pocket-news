<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>巴基斯坦人齐唱国歌欢呼鼓掌</title></head><body><p><a href="/">返回</a></p><p><b>巴基斯坦人齐唱国歌欢呼鼓掌</b></p><p>百度热搜　热度 732.8万</p><p>11月25日，神舟二十四号载人飞船与火箭成功分离，进入预定轨道，发射取得圆满成功。本次神舟二十四号任务搭载一名巴基斯坦载荷专家一同飞天，中国空间站迎来首位外籍航天员到访。观看直播的巴基斯坦人民看到发射后欢呼、鼓掌、起立齐唱国歌。</p><p><a href="a48">上一条</a> <a href="a50">下一条</a></p></body></html>
