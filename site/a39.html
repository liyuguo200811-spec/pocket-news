<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>澳门居民珠海养老 每人每月补 1</title></head><body><p><a href="/">返回</a></p><p><b>澳门居民珠海养老 每人每月补助5千元</b></p><p>百度热搜　热度 714.4万</p><p>11月起，澳门社会工作局开辟澳门以外养老新渠道，首阶段选定珠海金湾颐养园为试点院舍。此前，该局本月推出《澳门长者跨境养老服务计划》，符合条件的65岁以上澳门居民入住后，每人每月可获发5000元人民币院费补助，覆盖床位及24小时护理等。</p><p><a href="a38">上一篇</a></p></body></html>
