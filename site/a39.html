<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>这部差点没拍成的剧 一出场就 1</title></head><body><p><a href="/">返回</a></p><p><b>这部差点没拍成的剧 一出场就是王炸</b></p><p>百度热搜　热度 714.1万</p><p>近日，电视剧《谷雨》热度持续攀高。导演李路受访时透露，该剧取材自1994至2009年间的真实税务案件。此前他曾婉拒执导，接手后组织编剧进组打磨剧本，并邀请税务工作者把关细节。李路表示，拍剧需拿捏情感与法治尺度，不宣教，将解读权还给观众。</p><p><a href="a38">上一篇</a></p></body></html>
