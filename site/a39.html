<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>孔子其实根本不姓孔 1</title></head><body><p><a href="/">返回</a></p><p><b>孔子其实根本不姓孔</b></p><p>百度热搜　热度 714.0万</p><p>叫了千百年的“孔夫子”，其实他根本不姓孔！孔子实为子姓孔氏，名丘字仲尼，系殷商王室后裔。先秦时期姓与氏区分明确，姓辨血缘，氏辨贵贱。因当时有“女子称姓，男子称氏”的传统，故孔子称氏不称姓。</p><p><a href="a38">上一篇</a></p></body></html>
