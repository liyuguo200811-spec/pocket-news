<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>【诗画中国】落一点白 藏一冬安</title></head><body><p><a href="/">返回</a></p><p><b>【诗画中国】落一点白 藏一冬安</b></p><p>中国新闻网　11-22 08:57</p><p>【诗画中国】秋味入诗 食与时和【诗画中国】画里赏金秋 诗中庆丰年小雪时节是初冬温柔的序章，此时草木敛色，万物归藏，烟火仍照常温热，它藏着古人顺时而安的诗意，也藏着岁暮安然的期许。探访秘鲁钱凯港：跨越太平洋的发展新机遇湖北巴东金丝猴国家级自然保护区“鸟家族”扩容数万名日本民众签名反对日本拥有核潜艇积雪浮云端 秦岭雪后秘境美不胜收安徽平天湖：晨雾绘冬韵 生态入画来</p><p><a href="a04">上一条</a> <a href="a06">下一条</a></p></body></html>
