<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>玄奘</title></head><body><p><b>玄奘</b></p><p>中国古代　西行五万里</p><p>贞观元年从长安出发西行求法，穿越沙漠雪山，历四年抵天竺那烂陀寺。游学十七年，带回佛经六百五十七部。回国后主持译经十九年，译出七十五部、一千三百余卷，并口述《大唐西域记》。</p><p>适用 求知·毅力·交流</p><p><a href="sucai">回素材库</a> <a href="sc09">上一张</a> <a href="sc11">下一张</a></p></body></html>
