<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>岳飞</title></head><body><p><b>岳飞</b></p><p>中国古代　三十功名尘与土</p><p>二十岁从军，四次北伐，率岳家军收复襄阳六郡，进军朱仙镇。后被以“莫须有”罪名害于风波亭，年三十九。《满江红》中“三十功名尘与土，八千里路云和月”流传至今。</p><p>适用 忠诚·悲剧·气节</p><p><a href="sucai">回素材库</a> <a href="sc16">上一张</a> <a href="sc18">下一张</a></p></body></html>
