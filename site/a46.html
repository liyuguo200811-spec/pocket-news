<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>神舟二十四号发射成功</title></head><body><p><a href="/">返回</a></p><p><b>神舟二十四号发射成功</b></p><p>百度热搜　热度 761.8万</p><p>11月25日，搭载神舟二十四号载人飞船的长征二号F遥二十四运载火箭在酒泉卫星发射中心点火发射。神舟二十四号载人飞船与火箭成功分离，进入预定轨道，发射取得圆满成功。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
