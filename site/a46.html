<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>法院回应34米路绿灯12秒行人被</title></head><body><p><a href="/">返回</a></p><p><b>法院回应34米路绿灯12秒行人被撞亡</b></p><p>百度热搜　热度 752.4万</p><p>成都34米人行横道原绿灯仅12秒，腿部四级残疾的翟建设通行时被摩托车撞倒身亡。该案历经多轮审理，最终中院认定双方同等责任，判令摩托车主赔偿77万余元、保险公司赔18万。双方均不服判决，摩托车主准备申诉，家属也在商议再审。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
