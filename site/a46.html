<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>10月份工业经济总体平稳</title></head><body><p><a href="/">返回</a></p><p><b>10月份工业经济总体平稳</b></p><p>百度热搜　热度 761.9万</p><p>10月份，我国工业生产总体平稳，新动能支撑有力，工业经济持续向新向优向好发展。规模以上装备制造业增加值同比增长10.6%，高技术制造业增加值同比增长17.6%，创近五年最高增速。3D打印设备产量增长85.9%。工业品出口再创新高，规模以上工业企业出口交货值创近五年来最高增速。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
