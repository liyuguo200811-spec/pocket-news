<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>日媒逐帧解析特朗普无视高市：耻辱</title></head><body><p><a href="/">返回</a></p><p><b>日媒逐帧解析特朗普无视高市：耻辱</b></p><p>百度热搜　热度 752.2万</p><p>近日，日本首相高市早苗在特朗普与加拿大总理卡尼交谈时，上前拍其背部试图搭讪，却遭到完全无视。日媒对此直呼“非常耻辱”，并称日本外交未能走在世界前沿，反而沦为世界耻辱，陷入孤立无援、无人理睬的境地。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
