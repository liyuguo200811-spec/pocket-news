<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>照护“一老一小” 服务体系如何搭</title></head><body><p><a href="/">返回</a></p><p><b>照护“一老一小” 服务体系如何搭建</b></p><p>百度热搜　热度 761.6万</p><p>“一老一小”，是一个家庭最牵挂的两端。近日，国家四部门联合印发《“一老一小”服务体系建设实施方案》。专家解读指出，《实施方案》设定，到2030年有两个指标，一个是养老机构护理型床位占比73%，一个是社区养老设施覆盖率70%。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
