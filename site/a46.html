<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>特朗普回应深圳乘车时不拉窗帘</title></head><body><p><a href="/">返回</a></p><p><b>特朗普回应深圳乘车时不拉窗帘</b></p><p>百度热搜　热度 771.3万</p><p>11月18日晚，美国总统特朗普乘车前往欢迎晚宴。车队经过深圳街头时，特朗普拉开窗帘确实在看深圳的路，他表示：深圳的路真的没有坑洼！而我们的城市却脏兮兮。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
