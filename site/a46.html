<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>“一老一小”新政来了</title></head><body><p><a href="/">返回</a></p><p><b>“一老一小”新政来了</b></p><p>百度热搜　热度 761.9万</p><p>经国务院同意，国家发展改革委、民政部、国家卫生健康委、教育部日前印发《“一老一小”服务体系建设实施方案》，从改造升级2000个老旧公办养老机构，到打造“一刻钟托育服务圈”，再到探索“老幼共托”新模式，一系列实打实的举措正努力让养老服务更贴心、育儿家庭更安心。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
