<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>高交会 高在哪里</title></head><body><p><a href="/">返回</a></p><p><b>高交会 高在哪里</b></p><p>百度热搜　热度 761.6万</p><p>11月26日，第二十八届中国国际高新技术成果交易会在深圳开幕。高交会被誉为“中国科技第一展”，也是中国科技创新发展的风向标。当前，高交会已从“展示新技术的平台”转变为“高科技交易平台”、产业链互动平台和国际化创新合作平台，映照出中国科技创新奔涌的活力，展现了中国经济向新而行的底气。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
