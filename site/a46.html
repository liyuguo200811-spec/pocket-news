<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>从深圳出发 他们去了哪里</title></head><body><p><a href="/">返回</a></p><p><b>从深圳出发 他们去了哪里</b></p><p>百度热搜　热度 761.7万</p><p>11月19日，亚太经合组织（APEC）第三十三次领导人非正式会议在深圳落下帷幕。从深圳出发，下一站是哪儿？马斯克在会后飞往上海赶赴特斯拉上海超级工厂；新西兰Atrax集团董事总经理凯文·莫里斯跟着商务代表团走进东莞多家工厂，看产能、找配套、谈合作。</p><p><a href="a45">上一条</a> <a href="a47">下一条</a></p></body></html>
