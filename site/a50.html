<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>闲置银行卡千万别乱留</title></head><body><p><a href="/">返回</a></p><p><b>闲置银行卡千万别乱留</b></p><p>百度热搜　热度 723.8万</p><p>近期，多人因闲置银行卡未注销被骗子拿去洗钱，导致警察上门惹上麻烦。很多人以为剪碎卡片就安全，但实名账户仍在系统里。提醒大家不用的借记卡需带身份证去银行销户，避免影响征信。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
