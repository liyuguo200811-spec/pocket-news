<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>安徽通报4岁男童走失：已无生命体</title></head><body><p><a href="/">返回</a></p><p><b>安徽通报4岁男童走失：已无生命体征</b></p><p>百度热搜　热度 723.9万</p><p>11月19日，池州东至县一名4岁男童走失。当地随即组织干部、公安、消防及救援力量多方搜寻。25日当地通报，孩子于当日13时54分在村里水库水坑淤泥中被找到，已不幸身亡，警方后续调查仍在进行。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
