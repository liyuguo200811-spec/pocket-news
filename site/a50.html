<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>老人把杨帆认成胡歌求合影</title></head><body><p><a href="/">返回</a></p><p><b>老人把杨帆认成胡歌求合影</b></p><p>百度热搜　热度 723.2万</p><p>近日，在新疆喀什，杨帆被一位上海老人家误认成胡歌。因老人家称上海锦江饭店门口有胡歌的大海报，杨帆立马接梗自称胡歌，并开心地与老人家合影留念，现场气氛十分欢乐。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
