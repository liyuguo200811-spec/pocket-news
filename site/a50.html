<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>妻子打赏男主播519万 丈夫起诉</title></head><body><p><a href="/">返回</a></p><p><b>妻子打赏男主播519万 丈夫起诉返还</b></p><p>百度热搜　热度 723.6万</p><p>蓝先生发现妻子伊诺在2022年7月至2025年9月期间，给男主播打赏及赠物超519万元，遂起诉。11月2日，淄博市中级人民法院二审认定双方存不正当关系，赠与无效，判令男主播返还251万余元及折价赔偿50万余元物品。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
