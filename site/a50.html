<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>肝不好的人身上可能有一黄二红三黑</title></head><body><p><a href="/">返回</a></p><p><b>肝不好的人身上可能有一黄二红三黑</b></p><p>百度热搜　热度 723.5万</p><p>近日，人民日报健康客户端发文指出，肝脏受损时身体常表现出“一黄二红三黑”信号。“一黄”指眼白发黄；“二红”为手掌发红和蜘蛛痣；“三黑”包括黑眼圈、脸发黑和指甲发黑。一旦发现这些信号，务必及时就医检查，以免引发严重肝病。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
