<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>大量跟AI聊天患抑郁可能性高出3</title></head><body><p><a href="/">返回</a></p><p><b>大量跟AI聊天患抑郁可能性高出30%</b></p><p>百度热搜　热度 733.4万</p><p>2025年最新研究指出，过度依赖AI获取情绪陪伴会加重情绪问题。一项覆盖超2万人的调查显示，相较于不用AI的人，每天频繁用AI聊天者，中度及以上抑郁症状比例高出约30%。此外，AI的“谄媚性”会降低用户道歉反省意愿。专家建议将AI当“社交零食”而非情感寄托，警惕依赖。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
