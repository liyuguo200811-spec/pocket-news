<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>曝中方女保镖徐瑾曾战胜5名日本冠</title></head><body><p><a href="/">返回</a></p><p><b>曝中方女保镖徐瑾曾战胜5名日本冠军</b></p><p>百度热搜　热度 723.8万</p><p>11月20日，墨西哥总统辛鲍姆发视频致谢中方女保镖徐瑾。此前自16日辛鲍姆抵深圳参加APEC活动起，徐瑾全程贴身护卫。徐瑾曾负责多国领导人安保，被称“中国最美女保镖”，网传她曾一人战胜5名日本空手道冠军，专业素养获外宾认可。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
