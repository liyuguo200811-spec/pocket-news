<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>美国死刑执行又出意外</title></head><body><p><a href="/">返回</a></p><p><b>美国死刑执行又出意外</b></p><p>百度热搜　热度 723.7万</p><p>11月19日晚，美国得州70岁男犯丹尼斯被执行死刑。狱方花费1个多小时才找到静脉，将针扎入其左脚和颈部。药物推入后丹尼斯痛得尖叫数分钟才失去意识，得州惩教局坚称这是一次成功的处决。此前10月初，田纳西州一名50岁女死囚连打两针致死药物未死被叫停送医，半月前称正康复。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
