<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>旺仔牛奶更不好卖了</title></head><body><p><a href="/">返回</a></p><p><b>旺仔牛奶更不好卖了</b></p><p>百度热搜　热度 723.3万</p><p>11月23日，中国旺旺发布业绩。财报显示，在截至2026年9月30日的6个月内，中国旺旺营收同比下滑9.7%至100.26亿元；归母净利润同比下滑39.9%至10.33亿元。其中，堪称业绩压舱石的旺仔牛奶销售下滑明显。</p><p><a href="a49">上一条</a> <a href="a51">下一条</a></p></body></html>
