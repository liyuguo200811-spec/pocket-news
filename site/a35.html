<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>证监会出手！“南京路宝宝总” 1</title></head><body><p><a href="/">返回</a></p><p><b>证监会出手！“南京路宝宝总”被查处</b></p><p>百度热搜　热度 752.3万</p><p>近日，中国证监会对网名为“南京路宝宝总”的安某涉嫌编造传播证券市场误导性信息一案作出行政处罚，‌罚款20万元‌。“南京路宝宝总”曾在网络平台发布涉中公教育的“赌约帖”，以立帖为证方式作出一年内涨不到20倍等夸张低俗承诺，引发大量围观和跟风炒作，导致该股股价异常波动。</p><p><a href="a34">上一篇</a> <a href="a36">下一篇</a></p></body></html>
