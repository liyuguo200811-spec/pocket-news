<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>地面零距离实拍歼-35A 1</title></head><body><p><a href="/">返回</a></p><p><b>地面零距离实拍歼-35A</b></p><p>百度热搜　热度 723.5万</p><p>11月28日，一架歼-35A隐身战机抵达珠海，将参加第十六届中国航展。这是歼-35A首次落地珠海，记者零距离实拍可见，机首有中航工业英文简写及经过隐身处理的折叠式受油头盖板轮廓。</p><p><a href="a36">上一篇</a> <a href="a38">下一篇</a></p></body></html>
