<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>房主刚签完卖房合同得知房子要 1</title></head><body><p><a href="/">返回</a></p><p><b>房主刚签完卖房合同得知房子要拆迁</b></p><p>百度热搜　热度 733.2万</p><p>2025年10月11日，小李与胡某签订178万元购房合同并支付5万元定金。次日，案涉房屋被划入拟征收红线范围。胡某因预期补偿更高要求解约遭拒，小李遂起诉。近日，法院一审判决解除合同，胡某返还5万元定金并赔偿25万元。</p><p><a href="a36">上一篇</a> <a href="a38">下一篇</a></p></body></html>
