<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>泰国曼谷一炼油厂发生爆炸 现场浓</title></head><body><p><a href="/">返回</a></p><p><b>泰国曼谷一炼油厂发生爆炸 现场浓烟滚滚造成至少7人受伤</b></p><p>中国新闻网　11-27 11:42</p><p>中蒙俄国际旅客列车从北京发车综合外媒报道，当地时间26日，泰国首都曼谷邦纳区政府称，当地一家炼油厂发生爆炸，造成至少7人受伤。图为当地时间11月26日，事故现场升起滚滚浓烟。贵阳：观山湖云雾缥缈 绘就生态画卷青海西宁：冬日大熊猫憨态可掬惹人爱神舟二十四号载人飞船发射取得圆满成功哈尔滨冰雪大世界启用20万立方米存冰</p><p><a href="a06">上一条</a> <a href="a08">下一条</a></p></body></html>
