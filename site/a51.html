<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>年轻人为什么不接电话了</title></head><body><p><a href="/">返回</a></p><p><b>年轻人为什么不接电话了</b></p><p>百度热搜　热度 713.8万</p><p>2025年数据显示，全国手机用户日均拒接、漏接陌生来电比例达68%，年轻人更高达76%。起因是骚扰电话频发，其背后隐藏着包含AI外呼、线路出租等环节的商业链。运营商从提供线路到治理骚扰，再到推出身份认证服务，将一通电话做成了生意闭环。</p><p><a href="a50">上一条</a></p></body></html>
