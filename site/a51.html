<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>杨蓉自曝患特发性震颤</title></head><body><p><a href="/">返回</a></p><p><b>杨蓉自曝患特发性震颤</b></p><p>百度热搜　热度 714.2万</p><p>近日，45岁演员杨蓉自曝患特发性震颤，抖动蔓延全身且无法根治。此前，她11岁学舞蹈时即发现该症状，随年龄增长逐渐加重。杨蓉表示，希望借自身经历鼓励他人放下无能为力之事。</p><p><a href="a50">上一条</a></p></body></html>
