<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>朱一龙赵丽颖顶峰相见了</title></head><body><p><a href="/">返回</a></p><p><b>朱一龙赵丽颖顶峰相见了</b></p><p>百度热搜　热度 713.6万</p><p>近日，第46届华鼎奖揭晓，朱一龙、赵丽颖分别获得华语最佳影视男、女演员奖。两人因《知否》中的齐衡与盛明兰有缘无分，被网友称为“顶峰相见”，此番同台领奖，话题冲上热搜。</p><p><a href="a50">上一条</a></p></body></html>
