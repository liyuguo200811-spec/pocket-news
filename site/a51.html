<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>女生刷到“另一个自己”鉴定是亲姐</title></head><body><p><a href="/">返回</a></p><p><b>女生刷到“另一个自己”鉴定是亲姐妹</b></p><p>百度热搜　热度 723.4万</p><p>近日，失散20年的双胞胎姐妹小夏和小罗经DNA鉴定确认血缘关系。此前，两人分别在四川广安和达州长大，后同在深圳生活却未谋面。今年10月30日，堂哥刷短视频发现酷似女孩，双方核对线索后相认。针对“剧本”质疑，媒体走访户籍及求学地核查，并委托机构鉴定，证实两人为同卵双生子。</p><p><a href="a50">上一条</a> <a href="a52">下一条</a></p></body></html>
