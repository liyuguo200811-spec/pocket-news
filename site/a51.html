<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>日本网友对比石破茂与高市APEC</title></head><body><p><a href="/">返回</a></p><p><b>日本网友对比石破茂与高市APEC表现</b></p><p>百度热搜　热度 714.3万</p><p>11月22日，据媒体报道，日本网民对比石破茂和高市早苗在APEC峰会的表现引发讨论。此前在2024年APEC峰会期间，石破茂被问候时仍坐着不起身；而高市早苗在深圳出席峰会时无人主动靠近。有网民称高市因怪异举动多被认定“不太对劲”。</p><p><a href="a50">上一条</a></p></body></html>
