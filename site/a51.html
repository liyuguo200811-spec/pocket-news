<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>为什么景区大门到景点总有一段长路</title></head><body><p><a href="/">返回</a></p><p><b>为什么景区大门到景点总有一段长路</b></p><p>百度热搜　热度 704.1万</p><p>此前，景区大门外移及摆渡车收费频频引发投诉。媒体解读指出，大门外移主因包括生态保护红线限制、带动地方经济发展及部分景区变相强制消费。此前2018年门票限价政策出台，致使门票收入受限，景区转而依赖摆渡车等填补基建债务。</p><p><a href="a50">上一条</a></p></body></html>
