<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>国常会通稿首提“国家队”</title></head><body><p><a href="/">返回</a></p><p><b>国常会通稿首提“国家队”</b></p><p>百度热搜　热度 713.9万</p><p>11月27日，国务院常务会议研究深化资本市场投融资改革，通稿首次提及“国家队”，明确发挥其稳市作用并优化中央汇金功能。消息发布后，A股大涨，上证指数涨超3%，深成指涨超7%，创业板指涨超11%。</p><p><a href="a50">上一条</a></p></body></html>
