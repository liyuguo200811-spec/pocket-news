<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>国台办回应高市早苗最新涉台表态</title></head><body><p><a href="/">返回</a></p><p><b>国台办回应高市早苗最新涉台表态</b></p><p>百度热搜　热度 713.8万</p><p>11月25日，国务院台办举行例行新闻发布会，发言人张晗回应记者有关“日本首相高市早苗称日本对台湾问题的‘立场没有任何改变’”，她表示，台湾问题是中国内政，不容任何外来干涉。日方应恪守一个中国原则和中日四个政治文件精神，在台湾问题上尽快纠正错误言行。</p><p><a href="a50">上一条</a></p></body></html>
