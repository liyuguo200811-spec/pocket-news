<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>“状元”自首 韩国已人人自危</title></head><body><p><a href="/">返回</a></p><p><b>“状元”自首 韩国已人人自危</b></p><p>百度热搜　热度 713.5万</p><p>11月19日韩国高考日，政府发警报严查作弊。此前，11月15日，韩国税务师资格考试“状元”韩某发视频自首，承认用微型摄像头和AI作弊。受此波及，满分考生李镇宇遭作弊质疑，原定19日直播自证清白，但当天下午被发现在旅馆内死亡，尸检未见他杀迹象。接连事件动摇了韩国社会对考试公平的信任。</p><p><a href="a50">上一条</a></p></body></html>
