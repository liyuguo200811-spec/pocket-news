<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>人民日报：别把“豆包”当医生</title></head><body><p><a href="/">返回</a></p><p><b>人民日报：别把“豆包”当医生</b></p><p>百度热搜　热度 713.8万</p><p>近日，有患者用AI“豆包”看病并质疑医生诊断引发关注。如今AI成医患间第三方力量，部分患者用AI答案“问责”医生增加沟通成本。AI虽有方便、耐心等优势，但仅是辅助工具，存在误诊风险且无法共情。此前相关部门已明确AI不能替代医生决策。</p><p><a href="a50">上一条</a></p></body></html>
