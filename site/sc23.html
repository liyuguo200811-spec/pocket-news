<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>樊锦诗</title></head><body><p><b>樊锦诗</b></p><p>中国近现代　敦煌的女儿</p><p>1963 年从北京大学毕业后到敦煌，一待五十多年。她推动“数字敦煌”，把莫高窟的壁画用高清影像保存下来。她说“此生命定，我就是个莫高窟的守护人”。</p><p>适用 选择·坚守·文化传承</p><p><a href="sucai">回素材库</a> <a href="sc22">上一张</a> <a href="sc24">下一张</a></p></body></html>
