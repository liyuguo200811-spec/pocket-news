<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>《黑神话：悟空》制作人冯骥发 4</title></head><body><p><a href="/">返回</a></p><p>4/4</p><p>”他提出，在坚持按劳分配为主体的前提下，把未来由 AI 替代人工创造的超额物质财富，平等地普惠每个人。他还主张，当 AI 取代绝大多数人类劳动、抹平人与人在生产端的个体差异之后，社会不能再只以生产端的贡献去衡量人的价值。</p><p>人不是生产的手段，人只能是生产的目的。每一个人都同样生而高贵，AI 创造的基础物质丰裕，理应通过全民分红，平等地惠及每一个人。IT之家注意到，文章最后，冯骥还写下：去死吧，赛博朋克。去死吧，黑暗启蒙。每个人自由发展的时代，必将到来！</p><p>冯骥《后 AI 时代最重要的问题》全文如下：</p><p><a href="a16-3">上一页</a> <a href="a15">上一篇</a> <a href="a17">下一篇</a></p></body></html>
