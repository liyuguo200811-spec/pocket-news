<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>2名日本人在上海发生冲突 1人死</title></head><body><p><a href="/">返回</a></p><p><b>2名日本人在上海发生冲突 1人死亡</b></p><p>百度热搜　热度 781.0万</p><p>据日本驻上海总领事馆通报，日前，两名日本人在中国上海发生冲突，其中一人死亡，另一人事发后被当地警方逮捕。但在报道此案时，部分日媒及日本门户网站故意使用了“一名日本人在上海死亡，另一人被逮捕”的误导性措辞，被众多中日网民批评，有人表示，这种阴险栽赃的手法让人想起了侵华日军当年在卢沟桥事变的“黑历史”。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
