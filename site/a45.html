<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>蔡磊已进入渐冻症终末期</title></head><body><p><a href="/">返回</a></p><p><b>蔡磊已进入渐冻症终末期</b></p><p>百度热搜　热度 771.4万</p><p>近日，蔡磊妻子段睿表示蔡磊已进入渐冻症终末期。她坦言无法接受其现状，称上次见面全程无话，“一直在哭，根本控制不住”。据悉，2019年9月，蔡磊被确诊为渐冻症。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
