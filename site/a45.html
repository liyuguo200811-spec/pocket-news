<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>解决养老带娃难题的新政来了</title></head><body><p><a href="/">返回</a></p><p><b>解决养老带娃难题的新政来了</b></p><p>百度热搜　热度 761.9万</p><p>11月24日，由国家发改委等四部门联合印发《“一老一小”服务体系建设实施方案》对外公布。方案明确，到2030年社区养老服务覆盖率达七成，将翻新升级约2000家老旧公办养老院；同时推动打造一刻钟托育服务圈，鼓励单位办托班，并扩大养老与托育普惠服务供给，以平价服务惠及家庭。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
