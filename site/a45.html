<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>油价有望两连降 92号汽油或回7</title></head><body><p><a href="/">返回</a></p><p><b>油价有望两连降 92号汽油或回7字头</b></p><p>百度热搜　热度 771.4万</p><p>截至11月24日测算，国内汽柴油应下调520元/吨，折合每升约0.42元。11月26日24时国内油价将开启调整窗口，本轮下调几成定局。下调后，我国92号汽油和0号柴油有望双双回落至“7”字头。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
