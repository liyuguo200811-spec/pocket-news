<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>蓬莱出现海滋现象：岛全浮在空中</title></head><body><p><a href="/">返回</a></p><p><b>蓬莱出现海滋现象：岛全浮在空中</b></p><p>百度热搜　热度 771.4万</p><p>11月23日，山东烟台蓬莱北部海域出现海滋现象。受海水与空气层较大温差影响，光线发生折射或全反射，导致岛屿、船只等实体景物变形。现场可见岛屿被分割成多块飘在空中，渔船宛如在海上行走。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
