<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>APEC“中国年”留下这些珍贵瞬</title></head><body><p><a href="/">返回</a></p><p><b>APEC“中国年”留下这些珍贵瞬间</b></p><p>百度热搜　热度 761.6万</p><p>亚太经合组织第三十三次领导人非正式会议近日在深圳成功举行。短短几天，历史性的瞬间一个接一个，首先是APEC的21个成员经济体的领导人、代表再次聚齐，拍下了近十年来最全的一张“全家福”。此外，中俄美三国元首历史性会晤、工商领导人峰会，以及一系列双边会谈密集展开，重磅新闻接连不断。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
