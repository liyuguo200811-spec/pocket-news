<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>130/80不再列为“正常血压”</title></head><body><p><a href="/">返回</a></p><p><b>130/80不再列为“正常血压”</b></p><p>百度热搜　热度 771.4万</p><p>2026年10月，国际高血压学会发布《2026版全球高血压实践指南》。新版指南将130~139/80~89毫米汞柱区间由“正常高值血压”改为“血压升高”，明确不再属健康状态需尽早干预。</p><p><a href="a44">上一条</a> <a href="a46">下一条</a></p></body></html>
