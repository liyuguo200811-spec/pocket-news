<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>屈原</title></head><body><p><b>屈原</b></p><p>中国古代　其志洁，故其称物芳</p><p>楚国贵族，官至左徒，主张联齐抗秦，两度被放逐。流放中写下《离骚》《九歌》《天问》。公元前 278 年秦破郢都，他自沉汨罗江，年约六十二。司马迁评他“其志洁，故其称物芳”。</p><p>适用 家国·气节·文学</p><p><a href="sucai">回素材库</a> <a href="sc01">上一张</a> <a href="sc03">下一张</a></p></body></html>
