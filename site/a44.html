<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>幼儿园要招2岁孩子了</title></head><body><p><a href="/">返回</a></p><p><b>幼儿园要招2岁孩子了</b></p><p>百度热搜　热度 781.0万</p><p>11月23日，国家发改委、民政部、国家卫生健康委、教育部发布《“一老一小”服务体系建设实施方案》。方案提出，支持有条件的幼儿园实施改造和改扩建，举办面向2岁至3岁幼儿的托班；合理布局建设托育机构，打造“一刻钟托育服务圈”，并引导托育机构向有需求的农村延伸。</p><p><a href="a43">上一条</a> <a href="a45">下一条</a></p></body></html>
