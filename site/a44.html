<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>中方就日侵闯钓鱼岛领海提出严正交</title></head><body><p><a href="/">返回</a></p><p><b>中方就日侵闯钓鱼岛领海提出严正交涉</b></p><p>百度热搜　热度 780.9万</p><p>11月26日，外交部发言人郭嘉昆表示，日本船只非法侵闯钓鱼岛领海挑衅滋事，严重侵犯中国主权。中方已向日方提出严正交涉，中国海警船依法对有关船只采取必要管控措施。中方敦促日方恪守中日四点原则共识，停止一切侵权挑衅行为，防止类似事件再次发生。</p><p><a href="a43">上一条</a> <a href="a45">下一条</a></p></body></html>
