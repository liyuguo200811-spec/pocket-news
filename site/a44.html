<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>“天下第一财神庙”重新开放</title></head><body><p><a href="/">返回</a></p><p><b>“天下第一财神庙”重新开放</b></p><p>百度热搜　热度 781.0万</p><p>11月26日，杭州北高峰灵顺寺（天下第一财神庙）历经半年全面封闭修缮后重新开放。此前，该寺建筑、消防等基础设施已全面修缮并验收合格。消息引发游客纷纷相约“首爬”，山脚下商家也期待借此客流回暖。</p><p><a href="a43">上一条</a> <a href="a45">下一条</a></p></body></html>
