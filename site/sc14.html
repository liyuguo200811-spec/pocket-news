<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>范仲淹</title></head><body><p><b>范仲淹</b></p><p>中国古代　先天下之忧而忧</p><p>少年家贫，读书时“断齑画粥”。为官三十余年，三次被贬，仍“每感激论天下事，奋不顾身”。主持庆历新政，写下《岳阳楼记》，“先天下之忧而忧，后天下之乐而乐”。</p><p>适用 担当·情怀·改革</p><p><a href="sucai">回素材库</a> <a href="sc13">上一张</a> <a href="sc15">下一张</a></p></body></html>
