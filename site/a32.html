<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>警方提级调查50人采摘蜜桔仅 1</title></head><body><p><a href="/">返回</a></p><p><b>警方提级调查50人采摘蜜桔仅留10元</b></p><p>百度热搜　热度 780.8万</p><p>近日，武汉市东西湖区一农场遭遇50多人采摘蜜桔后仅留下10元，引发广泛关注。11月27日，武汉市东西湖区公安分局提级介入调查该事件。对此，律师认为采摘团行为涉嫌盗窃或将面临治安处罚。</p><p><a href="a31">上一篇</a> <a href="a33">下一篇</a></p></body></html>
