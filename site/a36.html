<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>中国南方发现未知古人类支系 1</title></head><body><p><a href="/">返回</a></p><p><b>中国南方发现未知古人类支系</b></p><p>百度热搜　热度 742.9万</p><p>近日，中国科学院古脊椎动物与古人类研究所等，针对在南宁隆安穿山洞和柳州鹿寨龙船洞两处地点获得的4颗人类牙齿化石，开展了古蛋白质组学和形态学综合分析，首次确认岭南存在‌丹尼索瓦人‌及一支‌未知古人类支系‌。</p><p><a href="a35">上一篇</a> <a href="a37">下一篇</a></p></body></html>
