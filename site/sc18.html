<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>文天祥</title></head><body><p><b>文天祥</b></p><p>中国古代　留取丹心照汗青</p><p>元军南下时散尽家财募兵勤王，兵败被俘，囚禁四年。元世祖亲劝降，答“愿赐之一死足矣”。在大都狱中写下《正气歌》。就义时年四十七，衣带中留有“孔曰成仁，孟曰取义”。</p><p>适用 气节·抉择</p><p><a href="sucai">回素材库</a> <a href="sc17">上一张</a> <a href="sc19">下一张</a></p></body></html>
