<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>特斯拉</title></head><body><p><b>特斯拉</b></p><p>外国　放弃专利的人</p><p>为谋生曾在街头挖沟，四处推销交流电方案。与爱迪生的直流电展开“电流之战”，最终交流电胜出。他放弃交流电专利，否则每马力可得六美元，会成为首富。晚年独居酒店，与鸽子为伴。</p><p>适用 远见·舍弃·孤独</p><p><a href="sucai">回素材库</a> <a href="sc51">上一张</a> <a href="sc53">下一张</a></p></body></html>
