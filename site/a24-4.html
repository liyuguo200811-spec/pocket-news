<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>9.69 万元，奇瑞 QQ3 4</title></head><body><p><a href="/">返回</a></p><p>4/4</p><p>此前，主打个性化设计的全新 QQ3 摩登版，在上市两个月后订单量就突破了 1.5 万台。整个全新 QQ3 车系的市场表现也在持续增长，据奇瑞公布的数据，自上市以来，全新 QQ3 已经连续 7 个月实现销量增长，11 月销量突破了 2 万台，全球累计用户规模超过了 12 万。</p><p>海外市场方面，全新 QQ3 已经进入印尼、泰国、南非等 10 余个国家，并在南非上市首月取得了当地纯电汽车销量冠军，按照规划，明年还将陆续进入英国、法国、意大利等欧洲市场。</p><p><a href="a24-3">上一页</a> <a href="a23">上一篇</a> <a href="a25">下一篇</a></p></body></html>
