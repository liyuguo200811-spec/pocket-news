<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.2//EN" "http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/><title>杜甫</title></head><body><p><b>杜甫</b></p><p>中国古代　安得广厦千万间</p><p>三十五岁赴长安应试落第，困居十年。安史之乱中携家逃难，幼子饿死。乾元二年入蜀，在成都浣花溪畔建草堂，写下《茅屋为秋风所破歌》。存诗一千四百余首，被称为“诗史”。</p><p>适用 悲悯·现实·家国</p><p><a href="sucai">回素材库</a> <a href="sc11">上一张</a> <a href="sc13">下一张</a></p></body></html>
