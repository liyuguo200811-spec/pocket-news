<!DOCTYPE html>

<style>
  body { margin:0; padding:24px; background:#eef0f3; font:14px/1.6 "Microsoft YaHei",sans-serif; color:#333; }

<h1>口袋新闻 · 老年机预览</h1>
<p class="tip">每台“手机”是一个固定宽度的独立视口，页面在里面是真实换行效果。桌面浏览器给段落的默认间距远大于老手机，字号也是 16px 而老诺基亚约 10px，所以真机上同样一屏能多显示 3~4 条标题。</p>
<div class="row">
  <div class="item">
    <div class="label"><b>128 × 160</b>诺基亚 S30 · 首页</div>

  </div>
  <div class="item">
    <div class="label"><b>240 × 320</b>诺基亚 S40 · 首页</div>

  <div class="item">
